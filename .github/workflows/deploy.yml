name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Triggers on push to the main branch
  workflow_dispatch:   # Allows you to trigger this manually from GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Vite Production Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Dist Folder Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Only upload the compiled folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
